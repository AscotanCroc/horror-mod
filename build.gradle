plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom already adds the repositories needed for Minecraft and Fabric.
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "horror_mod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            vmArg "-Xmx3G"
        }
        server {
            vmArg "-Xmx2G"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def installDevMods = tasks.register("installDevMods", Copy) {
    from("libs")
    include("Axiom-6.1.5-for-MC26.3.jar", "worldedit-mod-7.4.6.jar")
    into("run/mods")
}

tasks.named("runClient").configure { dependsOn installDevMods }
tasks.named("runServer").configure { dependsOn installDevMods }

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_${projectName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
